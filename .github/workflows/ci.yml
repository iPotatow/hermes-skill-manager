name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test Desktop plugin contract
        run: node --test tests/desktop_plugin_smoke.test.js
      - name: Test backend contract
        run: python3 -m unittest discover -s tests -v
